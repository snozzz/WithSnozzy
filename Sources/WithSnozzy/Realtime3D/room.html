<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' file:; worker-src 'self' blob:;">
  <title>With Snozzy · 3D Room</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif; }
    html, body, #room-root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #161730; user-select: none; -webkit-user-select: none; }
    #room-root { position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .room-tooltip {
      position: absolute; z-index: 20; pointer-events: none;
      padding: 6px 11px; border-radius: 11px;
      border: 1px solid rgba(255, 224, 242, 0.24);
      background: rgba(20, 18, 38, 0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: rgba(255, 246, 252, 0.94); font-size: 11.5px; font-weight: 500;
      letter-spacing: 0.01em; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34);
      transition: opacity 0.14s ease;
    }
    .room-error {
      position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      width: min(340px, 78vw); padding: 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 18px; text-align: center;
      background: rgba(22, 19, 40, 0.90); color: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.44);
    }
    .room-error strong { display: block; margin-bottom: 9px; color: #f7a8ce; font-size: 14px; }
    .room-error span { color: rgba(255, 255, 255, 0.62); font-size: 11.5px; line-height: 1.48; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="room-root">
    <canvas id="room-canvas" aria-label="Snozzy 3D room"></canvas>
    <div id="room-tooltip" class="room-tooltip hidden"></div>
    <span id="room-status" class="hidden">正在打开房间…</span>
    <div id="room-loading" class="room-error"><strong>正在布置 Snozzy 的 3D 房间</strong><span>正在加载场景光影与角色材质…</span></div>
    <div id="room-error" class="room-error hidden"><strong>3D 房间暂时不可用</strong><span id="room-error-message">—</span></div>
  </div>
  <script src="./room.bundle.js"></script>
</body>
</html>
